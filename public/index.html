<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FROM TEXT TO FEELING</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo">SentimentAI</div>
      <div class="status">v1.0</div>
    </header>

    <main>
      <section class="hero">
        <h1>FROM TEXT TO FEELING</h1>
        <p>문장을 입력하면 AI가 감성을 분석합니다.</p>
      </section>

      <section class="interaction-area">
        <div class="input-panel">
          <textarea id="text-input" placeholder="분석할 문장을 입력해주세요 (최대 1000자)"></textarea>
          <button id="analyze-btn">분석하기</button>
        </div>

        <div id="error-box" class="error-box hidden">
          <p id="error-message"></p>
        </div>

        <div id="result-card" class="result-card hidden">
          <div class="result-header">
            <span class="label">Analysis Result</span>
            <span id="sentiment-badge" class="sentiment-badge"></span>
          </div>
          <div class="result-body">
            <div class="confidence">
              <span class="label">신뢰도</span>
              <div class="progress-bar">
                <div id="confidence-fill" class="progress-fill"></div>
              </div>
              <span id="confidence-text" class="confidence-text"></span>
            </div>
            <div class="reason">
              <span class="label">분석 이유</span>
              <p id="reason-text"></p>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
